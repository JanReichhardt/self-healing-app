name: ci
on: pull_request

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '27'
          cache: maven
          cache-dependency-path: service/pom.xml
      - name: Build and run the contract tests
        run: |
          mkdir -p service/src/test/java/demo
          cp verification/CheckoutContractTest.java service/src/test/java/demo/
          mvn -B -ntp -f service/pom.xml package
      - name: Start the app and check its behaviour
        run: |
          java -Dquarkus.http.port=8081 -jar service/target/quarkus-app/quarkus-run.jar > app.log 2>&1 &
          for i in $(seq 60); do curl -sf localhost:8081/q/health/ready && break; sleep 1; done
          post() { curl -s -o /dev/null -w '%{http_code}' -X POST localhost:8081/checkout -H 'content-type: application/json' -d "$1"; }
          [ "$(post '{"subtotalCents":10000,"coupon":null}')" = 200 ]
          [ "$(post '{"subtotalCents":10000}')" = 200 ]
          curl -sf -X POST localhost:8081/checkout -H 'content-type: application/json' -d '{"subtotalCents":10000,"coupon":"save10"}' | grep -q '"totalCents":9000'
          [ "$(post '{"subtotalCents":-1}')" = 400 ]
          ! grep -q ' ERROR ' app.log
      - if: always()
        uses: actions/upload-artifact@v4
        with: {name: app-log, path: app.log}
